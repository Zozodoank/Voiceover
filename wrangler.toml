# wrangler.toml - Konfigurasi Cloudflare Worker (free tier)
# Jalankan: npx wrangler dev (lokal, http://localhost:8787) | npx wrangler deploy (produksi)
name = "vo-affiliate-studio"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Seluruh isi public/ dilayani sebagai static assets (landing, app, admin, css, js)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV: menyimpan order QRIS ber-TTL (bukan saldo - saldo ada di D1 agar kuat-konsisten)
[[kv_namespaces]]
binding = "ORDERS"
id = "GANTI_DENGAN_ID_KV_ANDA"                    # npx wrangler kv namespace create ORDERS

# D1: database users (email, saldo, unlimited, total_gen)
[[d1_databases]]
binding = "VO_DB"
database_name = "vo-studio-db"
database_id = "GANTI_DENGAN_ID_D1_ANDA"           # npx wrangler d1 create vo-studio-db ; lalu npx wrangler d1 execute vo-studio-db --local --file=./schema.sql

# Variabel non-rahasia (rahasia via: npx wrangler secret put NAME / file .dev.vars saat dev)
[vars]
GOOGLE_CLIENT_ID = ""                              # Client ID OAuth dari Google Cloud Console
SUPERADMIN_EMAILS = "jho.j80@gmail.com"
WELCOME_CREDIT = "3600"   # saldo awal pendaftar baru (Rupiah) = 3 x tier termurah 1.200 -> 3 VO gratis
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_MODELS = "gemini-3.5-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite"   # rantai fallback sebelum AIVene (hemat free tier; 2.5-flash sudah 404)
AIVENE_MODEL = "qwen3.8-flash"
AIVENE_BASE_URL = "https://api.aivene.com/v1"
AIVENE_TTS_MODEL = "tts-1"                            # model TTS untuk pratinjau suara (via AIVene /audio/speech)
AIVENE_TTS_VOICES = ""                                # kosong = voice default; atau daftar nama dipisah koma (mis. "alloy,nova,shimmer")
GEMINI_FALLBACK_ENABLED = "true"
