# wrangler.toml - Konfigurasi Cloudflare Worker (free tier)
# Jalankan: npx wrangler dev (lokal, http://localhost:8787) | npx wrangler deploy (produksi)
name = "voiceover"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Seluruh isi public/ dilayani sebagai static assets (landing, app, admin, css, js)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV: menyimpan order QRIS ber-TTL (bukan saldo - saldo ada di D1 agar kuat-konsisten)
[[kv_namespaces]]
binding = "ORDERS"
id = "1226b5b8c77546a8bbf8ecfb6ecabc45"                    # npx wrangler kv namespace create ORDERS

# D1: database users (email, saldo, unlimited, total_gen)
[[d1_databases]]
binding = "VO_DB"
database_name = "vo-studio-db"
database_id = "323d1ad5-adc8-4afe-b764-c4625e11c340"           # npx wrangler d1 create vo-studio-db ; lalu npx wrangler d1 execute vo-studio-db --local --file=./schema.sql

# Variabel non-rahasia (rahasia via: npx wrangler secret put NAME / file .dev.vars saat dev)
[vars]
GOOGLE_CLIENT_ID = "646496051749-rf1b1gbke3954uqb3l1smqfnh9b7c9c3.apps.googleusercontent.com"                              # Client ID OAuth dari Google Cloud Console
SUPERADMIN_EMAILS = "megakomindo@gmail.com"
WELCOME_CREDIT = "3600"   # saldo awal pendaftar baru (Rupiah) = 3 x tier termurah 1.200 -> 3 VO gratis
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_MODELS = "gemini-3.5-flash, gemini-3.1-flash-lite, gemini-3.5-flash-lite"   # rantai fallback sebelum AIVene (hemat free tier; 2.5-flash sudah 404)
AIVENE_MODEL = "qwen3.8-flash"
AIVENE_BASE_URL = "https://api.aivene.com/v1"
# --- TTS: satu model per tier kualitas (frontend hanya memakai id tier netral) ---
TTS_MODEL_NORMAL = "gemini-2.5-flash-preview-tts"     # tier Normal
TTS_MODEL_SEDANG = "gemini-3.1-flash-tts-preview"     # tier Sedang
TTS_MODEL_TINGGI = "gemini-3.8-flash-tts"             # tier Tinggi (utama)
TTS_FALLBACK_ORDER = "gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts"  # fallback bila model tier gagal/429
TTS_STYLE_MODE = "natural"                            # natural = penyampaian realistis; energetic = gaya lama (berteriak)
TTS_TIMEOUT_MS = "30000"                              # batas satu panggilan TTS (model 3.x lebih lambat)
TTS_ALLOW_DEGRADE = "false"                           # true = izinkan fallback AIVene (kualitas lebih rendah)
GEMINI_TTS_VOICES = ""                                # kosong = daftar voice resmi bawaan; atau nama dipisah koma
AIVENE_TTS_MODEL = "tts-1"                            # hanya dipakai bila TTS_ALLOW_DEGRADE=true
AIVENE_TTS_VOICE = "nova"                              # voice AIVene tetap untuk fallback (jangan kirim voice Gemini)
AIVENE_TTS_VOICES = ""                                # (legacy) kosong = voice default Gemini
GEMINI_FALLBACK_ENABLED = "true"

# --- Observability (Workers Logs / Traces / Issues) ---
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
